<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Wayfare">
  <!--
    No logo was supplied with the design system, and it explicitly says not to draw one.
    This is the system's own wayfinding glyph (Lucide "compass") on the primary teal,
    used as a tab icon only — not as a brand mark.
  -->
  <rect width="32" height="32" rx="8" fill="#0f6b74" />
  <g fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="9" />
    <path d="m20.2 11.8-2.4 5.4-5.4 2.4 2.4-5.4z" />
  </g>
</svg>
